<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />

    <title>Inwentaryzacja Sprzętu Komputerowego</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="icon.jpg" />
    <script type="module" crossorigin src="./assets/index-DATHzFO9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-8a6Ng48s.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('Service Worker zarejestrowany pomyślnie:', reg.scope);
            })
            .catch((err) => {
              console.error('Błąd rejestracji Service Workera:', err);
            });
        });
      }
    </script>
  </body>
</html>
